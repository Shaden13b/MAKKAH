<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - موقع الحرمين</title>
  <link rel="stylesheet" href="style.css">
  <!-- مكتبة أيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- خلفية الفيديو -->
  <video autoplay muted loop id="bg-video">
    <source src="videos/BG1.mp4" type="video/mp4">
    متصفحك لا يدعم عرض الفيديو
  </video>

  <div class="container login-container">
    <header>
      <h1><i class="fas fa-mosque"></i> أهلاً بك في موقع الحرمين</h1>
      <div class="controls">
        <button id="toggle-mode"><i class="fas fa-moon"></i></button>
        <select id="lang-switch">
          <option value="ar">🇸🇦 العربية</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>
    </header>

    <!-- مربع تسجيل الدخول -->
    <div class="login-box">
      <h2><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</h2>
      <form action="index.html" method="get">
        <div class="input-group">
          <label><i class="fas fa-user"></i> الاسم</label>
          <input type="text" name="name" placeholder="أدخل اسمك" required>
        </div>
        <div class="input-group">
          <label><i class="fas fa-envelope"></i> البريد الإلكتروني (اختياري)</label>
          <input type="email" name="email" placeholder="example@mail.com">
        </div>
        <div class="input-group">
          <label><i class="fas fa-language"></i> اللغة المفضلة</label>
          <select name="lang">
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </div>
        <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> دخول</button>
        <a href="index.html" class="btn guest"><i class="fas fa-user-clock"></i> دخول كزائر</a>
      </form>
    </div>

    <footer>
      <p>© جميع الحقوق محفوظة - صنع بواسطة شادن</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
